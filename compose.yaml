services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: magi
      POSTGRES_USER: magi
      POSTGRES_PASSWORD: ${MAGI_DB_PASSWORD:?Set MAGI_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magi -d magi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - magi-postgres:/var/lib/postgresql/data

volumes:
  magi-postgres:

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magi-decision-system"
version = "0.3.0"
description = "Three-perspective decision support with deterministic arbitration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "langchain>=1.3,<2",
  "langchain-openai>=1.5,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "pydantic>=2,<3",
  "psycopg[binary,pool]>=3.3,<4",
  "python-dotenv>=1.2,<2",
  "uvicorn[standard]>=0.38,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
]

[project.scripts]
magi-report = "magi.clients.report_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
